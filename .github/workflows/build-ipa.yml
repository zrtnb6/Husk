name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-compile and package
    # Not macos-15: its newest Xcode is 26.3 (Swift 6.2.4), and the vendored
    # StikJIT.xcframework is built against Swift 6.4 -- Xcode 27. xcode-27 is
    # GitHub's preview image (macOS 27 + Xcode 27) and is the only one with a new
    # enough Swift compiler. runner.os is still "macOS", so the dependency cache
    # below keeps hitting across the move.
    runs-on: xcode-27
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain check
        run: |
          xcodebuild -version
          swift --version
          # src/app/Frameworks/StikJIT.xcframework ships only a textual Swift
          # interface -- there is no binary .swiftmodule to fall back on -- and it
          # was built with Swift 6.4. Anything older cannot parse it, and the
          # diagnostic is actively misleading: ~200 syntax errors pointing inside
          # the .swiftinterface, which read as "the framework is corrupt" rather
          # than "your compiler is too old". Assert the toolchain up front, where
          # it is one line.
          if ! swift --version | grep -qE "Swift version 6\.([4-9]|[1-9][0-9])|Swift version ([7-9]|[1-9][0-9])\."; then
            echo "::error::need Xcode 27 / Swift 6.4+: StikJIT.xcframework is built against it"
            exit 1
          fi

      - name: Disk before
        run: df -h /

      - name: Free disk space
        run: |
          # The Metal toolchain step below pulls down a few GB, so reclaim the
          # other Xcode installations and the simulator runtimes first. The image
          # is pinned to xcode-27, so nothing we build here needs them.
          sudo rm -rf /Applications/Xcode_15*.app 2>/dev/null || true
          sudo rm -rf /Applications/Xcode_16*.app 2>/dev/null || true
          sudo rm -rf /Applications/Xcode_26*.app 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true
          sudo rm -rf /usr/local/share/dotnet 2>/dev/null || true
          df -h /

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu || true

          # virglrenderer's src/gallium/meson.build calls
          #   find_installation('python3', modules: ['yaml'])
          # and aborts the whole configure if the interpreter the runner puts on
          # PATH (Homebrew's) cannot `import yaml`. Homebrew Python is PEP 668
          # externally managed, hence --break-system-packages.
          PY3="$(command -v python3)"
          "$PY3" -m pip install --break-system-packages -U pyyaml \
            || "$PY3" -m pip install --user -U pyyaml \
            || true

          echo "--- versions ---"
          meson --version || true
          ninja --version || true
          pkg-config --version || true
          xcodegen --version || true
          qemu-img --version | head -1 || true
          "$PY3" -c "import sys, yaml; print('python3', sys.executable, '/ pyyaml', yaml.__version__)"

          # Fail here, in the first minute, rather than eleven minutes into the
          # build when the missing piece finally gets used. qemu-img is needed by
          # the app target's pre-build phase (it stamps the qcow2 seeds); meson and
          # ninja by every meson stage; xcodegen regenerates the .pbxproj.
          missing=""
          for t in meson ninja pkg-config xcodegen qemu-img python3 cargo rustc; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing build tools:$missing"
            exit 1
          fi

      - name: Install the Metal toolchain
        run: |
          set -x
          xcode-select -p
          xcodebuild -showComponent MetalToolchain || true
          df -h /

          # Xcode 26 unbundled the Metal compiler into an optional component.
          # Without it the app target stops at
          #   error: cannot execute tool 'metal' due to missing Metal Toolchain
          # and there is no build setting that skips it -- Husk ships .metal
          # sources for its presenter.
          #
          # Do NOT probe with `xcrun --find metal`: the driver stub always lives
          # in XcodeDefault.xctoolchain, so it reports a path even when the
          # toolchain itself is absent. The toolchain is a separate MobileAsset
          # (mounted under cryptexd); ask Xcode whether it has it installed.
          if xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed"; then
            echo "Metal toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain \
              || sudo xcodebuild -downloadComponent MetalToolchain
          fi

          # Confirm it landed. xcrun memoises misses, so drop the cache first.
          xcrun --kill-cache || true
          xcodebuild -showComponent MetalToolchain || true
          xcrun metal --version || true

          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed"; then
            echo "::error::Metal toolchain could not be installed on this image"
            exit 1
          fi

      - name: Add Rust iOS target
        run: |
          rustup target add aarch64-apple-ios
          rustup target list --installed

      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/build
            third_party/sources
            third_party/gpu
            build
            guests
          key: husk-deps-${{ runner.os }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_ios.sh', 'patches/**') }}

      - name: Fix script permissions
        run: chmod +x scripts/*.sh

      # Before anything regenerates the project: packaging runs `xcodegen
      # generate`, and project.yml points a resource phase at this directory.
      # The helper seeds its DDI cache from the bundle, so the first mount does
      # not depend on the phone's own route to github.com.
      - name: Fetch the Developer Disk Image
        run: bash scripts/fetch_ddi.sh

      - name: Build everything and package the IPA
        run: |
          bash scripts/ci_build.sh "$GITHUB_WORKSPACE/build/Husk.ipa"

      - name: Verify the IPA
        run: |
          set -e
          ls -lh build/Husk.ipa build/Husk.tipa
          echo "--- payload ---"
          unzip -l build/Husk.ipa | head -40

          # The point of this build is that the helper carries the DDI, so the
          # first mount is offline. Assert the exact sizes: the image is mounted
          # as a unit, and Xcode silently rewrites a .plist it copies as an
          # ordinary resource (BuildManifest.plist went 804,946 -> 140,960
          # that way). A folder reference keeps all five intact; anything else
          # should fail here rather than on the phone.
          LIST=/tmp/ipa-listing.txt
          unzip -l build/Husk.ipa > "$LIST"
          echo "--- bundled DDI in the helper ---"
          grep -E "HuskJITHelper\.appex/DDI/" "$LIST" || {
            echo "::error::the JIT helper is missing the bundled Developer Disk Image"
            exit 1
          }
          check() {
            local got
            got=$(awk -v n="HuskJITHelper.appex/DDI/$1" '$NF == n { print $1 }' "$LIST")
            if [ "$got" != "$2" ]; then
              echo "::error::$1 is ${got:-absent} bytes in the helper, expected $2"
              exit 1
            fi
            echo "  ok  $1 = $got bytes"
          }
          check Image.dmg 15895040
          check BuildManifest.plist 804946
          check Image.dmg.trustcache 1895
          check Image.dmg.cryptex_info 430
          check Image.dmg.root_hash 229

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA
          path: |
            build/Husk.ipa
            build/Husk.tipa
            build/logs
          retention-days: 14
          if-no-files-found: error

      # actions/cache's own post step only writes when the job is green, so every
      # run that died late (ANGLE, virgl, QEMU, ...) threw away the ~25 minutes of
      # compiled dependencies and ANGLE it had already done, and the retry paid for
      # them again. Save unconditionally instead. Every stage in ci_build.sh is
      # guarded by an artefact or a stamp under build/stamps, so a half-finished
      # tree is resumed safely rather than trusted: a component without its stamp
      # is rebuilt from scratch.
      - name: Save dependency cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/build
            third_party/sources
            third_party/gpu
            build
            guests
          key: ${{ steps.cache.outputs.cache-primary-key }}
